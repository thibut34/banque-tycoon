<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banque Tycoon</title>
<meta name="description" content="Simulateur de banque : de Montpellier à Mars. Agences, guichets, prêts, marchés, crises et concurrents.">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><path d='M20 78h60M28 78V46M42 78V46M58 78V46M72 78V46M16 46 50 22l34 24z' stroke='white' stroke-width='7' fill='none' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
<script>
  // Si le design n'a pas été appliqué (cache ou proxy qui sert un vieux fichier), on le recharge.
  window.addEventListener('load', function () {
    if (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() === '') {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'style.css?r=' + Date.now(); document.head.appendChild(l);
    }
  });
</script>
</head>
<body>

<!-- Écran d'accueil -->
<div id="start" class="screen">
  <div class="start-bg"></div>
  <div class="start-box">
    <div class="logo-mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M9.5 21V10M14.5 21V10M19 21V10M2.5 10 12 3.5 21.5 10z"/></svg></div>
    <h1>Banque <span>Tycoon</span></h1>
    <p class="tagline">Ouvrez une petite agence à Montpellier. Embauchez, prêtez, survivez aux crises… et devenez la première banque du monde. Puis de la Lune.</p>

    <div class="start-card">
      <div id="continueBox" hidden>
        <button class="btn big primary" data-act="continue">Continuer la partie</button>
        <p class="muted small center" id="continueInfo"></p>
        <div class="sep">ou</div>
      </div>
      <label class="field">Nom de votre banque
        <div class="row">
          <input id="bankName" maxlength="32" autocomplete="off">
          <button class="btn ghost" data-act="randName" title="Nom au hasard">🎲</button>
        </div>
      </label>
      <button class="btn big gold" data-act="newGame">Ouvrir ma banque</button>
      <button class="btn ghost full" data-act="help">Comment jouer</button>
    </div>
    <div id="leaderboard"></div>
  </div>
</div>

<!-- Jeu -->
<div id="game" hidden>
  <aside id="side">
    <div class="brand"><span class="brand-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M9.5 21V10M14.5 21V10M19 21V10M2.5 10 12 3.5 21.5 10z"/></svg></span><div class="brand-txt"><b id="tbName"></b><small id="chapterPill"></small></div></div>
    <nav id="tabs"></nav>
  </aside>
  <div id="main">
    <header id="topbar">
      <div class="tb-date"><b id="tbDate"></b><span id="tbEcon" class="econ-pill"></span></div>
      <div class="tb-kpis">
        <div><small>Liquidités</small><b id="tbCash"></b></div>
        <div><small>Fonds propres</small><b id="tbEq"></b></div>
        <div><small>Solvabilité</small><b id="tbRatio"></b></div>
        <div><small>Réputation</small><b id="tbRep"></b></div>
        <div><small>Classement</small><b id="tbRank"></b></div>
      </div>
      <div class="tb-actions">
        <button class="btn icon ghost" id="muteBtn" data-act="mute" title="Son"></button>
        <button class="btn icon ghost" data-act="menu" title="Menu et pause (Échap)"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button>
      </div>
    </header>
    <main id="panel"></main>
    <div id="ticker"><div id="tickerText"></div></div>
  </div>
</div>

<div id="coach" hidden></div>
<div id="modal" hidden></div>
<div id="toasts"></div>

<script src="js/util.js?v=7"></script>
<script src="js/data.js?v=7"></script>
<script src="js/state.js?v=7"></script>
<script src="js/sim.js?v=7"></script>
<script src="js/events.js?v=7"></script>
<script src="js/floor.js?v=7"></script>
<script src="js/floorart.js?v=7"></script>
<script src="js/staff.js?v=7"></script>
<script src="js/custom.js?v=7"></script>
<script src="js/views1.js?v=7"></script>
<script src="js/views2.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
